# coturn 4.17.2 — TURN relay for WebRTC (mandatory, per the spine).
#
# Contains NO credential. `--realm`, `--static-auth-secret` and `--external-ip`
# are passed as flags by infra/docker-compose.yml from the environment file so
# that nothing secret is ever committed (AD-14).

listening-port=3478

# Relay range must match the UDP ports published in docker-compose.yml.
min-port=50100
max-port=50119

# Time-limited credentials derived from the shared secret: the application mints a
# short-lived username/password pair per session rather than handing out a static
# TURN login. Same reasoning as AD-9's short-lived room tokens.
use-auth-secret

fingerprint
no-cli

# The MVP has no multi-tenant TURN needs and no legacy clients.
no-tlsv1
no-tlsv1_1

# Never relay to loopback/private ranges: a TURN server that will proxy to
# 127.0.0.1 is an SSRF pivot into the host network.
no-loopback-peers
no-multicast-peers

# Logs go to the container's stdout so `docker compose logs` is the single place
# to look; a log file inside the container would just fill the layer.
log-file=stdout
simple-log
